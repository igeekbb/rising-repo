name: Update Data and Deploy to Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch fresh data from BigQuery
        id: fetch
        run: node scripts/fetch-data.js
        env:
          GOOGLE_SERVICE_KEY: ${{ secrets.GOOGLE_SERVICE_KEY }}
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        continue-on-error: true

      - name: Commit and push if data changed
        if: success() && steps.fetch.outcome == 'success'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add db.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: auto-update from BigQuery [skip ci]"
            git push
          fi

      - name: Install yarn
        run: npm install --global yarn

      - name: Install dependencies with yarn
        run: yarn install

      - name: Build with local data
        run: WITH_LOCAL_DATA=true yarn next build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
